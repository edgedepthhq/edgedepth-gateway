services:
  gateway:
    build: .
    image: edgedepthhq/edgedepth-gateway:latest
    container_name: edgedepth-gateway
    ports:
      - "8080:8080"
    environment:
      EDGEDEPTH_ADDR: ":8080"
      EDGEDEPTH_PATH: "/ws"
      EDGEDEPTH_LOG: "info"
      # Switch to "trade" if the tape stays empty while the orderbook updates:
      # some networks do not serve Binance's @aggTrade stream.
      BINANCE_TRADE_STREAM: "aggTrade"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
